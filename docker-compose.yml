services:
  mysql:
    image: mysql:8
    container_name: covourca-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: covourca
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: covourca-pma
    restart: unless-stopped
    ports:
      - "9090:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  app:
    build: .
    container_name: covourca-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/covourca?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Paris
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      # Hot-reload: read templates and static files directly from host
      SPRING_THYMELEAF_PREFIX: file:/app/templates/
      SPRING_THYMELEAF_CACHE: "false"
      SPRING_WEB_RESOURCES_STATIC_LOCATIONS: file:/app/static/,classpath:/static/
    volumes:
      - ./src/main/resources/templates:/app/templates
      - ./src/main/resources/static:/app/static
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
