# Configuration utilisée uniquement par "mvn test" (Jenkins n'a pas de MySQL)
spring.application.name=CovoURCA-test
spring.datasource.url=jdbc:h2:mem:covourca;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# schema.sql contient des ALTER TABLE spécifiques MySQL : on ne le joue pas en test
spring.sql.init.mode=never
spring.thymeleaf.cache=false
