<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Connexion – CovoURCA</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:420px">
  <div class="text-center mb-4">
    <h2 class="fw-bold" style="color:#8B6914;">CovoURCA</h2>
    <p class="text-muted">Connexion à votre compte</p>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <div th:if="${param.erreur}" class="alert alert-danger">Email ou mot de passe incorrect.</div>
      <div th:if="${param.deconnecte}" class="alert alert-success">Vous avez été déconnecté.</div>
      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

      <form th:action="@{/connexion}" method="post">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="username" required autofocus/>
        </div>
        <div class="mb-3">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-control" name="password" required/>
        </div>
        <button type="submit" class="btn w-100 fw-semibold text-white"
                style="background:#8B6914;">Se connecter</button>
      </form>
    </div>
  </div>
  <p class="text-center mt-3 text-muted">Pas encore inscrit ? <a th:href="@{/inscription}">Créer un compte</a></p>
</div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
