<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Connexion – CovoURCA</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
  <style>
    :root {
      --amber: #78350f;
      --amber-hover: #92400e;
      --amber-50: #fffbeb;
      --stone-50: #fafaf9;
      --stone-100: #f5f5f4;
      --stone-200: #e7e5e4;
      --stone-300: #d6d3d1;
      --stone-600: #57534e;
      --stone-900: #1c1917;
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(36px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes logoBounce {
      0%   { opacity: 0; transform: scale(0.7) translateY(-20px); }
      70%  { transform: scale(1.06) translateY(4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes inputFade {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--amber-50) 0%, #fff 50%, var(--stone-100) 100%);
      min-height: 100vh;
      animation: fadeIn 0.5s ease;
    }

    /* ── Logo ── */
    .covo-logo {
      display: inline-flex; align-items: center; gap: 0.6rem;
      text-decoration: none;
      animation: logoBounce 0.8s cubic-bezier(.36,.07,.19,.97) both;
    }
    .covo-logo img { height: 4rem; width: auto; }
    .covo-logo-text { display: flex; flex-direction: column; line-height: 1.15; text-align: left; }
    .covo-logo-name {
      font-weight: 800; font-size: 1.6rem;
      color: var(--amber); letter-spacing: -0.02em;
    }
    .covo-logo-sub {
      font-weight: 500; font-size: 0.65rem;
      color: var(--stone-600); letter-spacing: 0.04em; text-transform: uppercase;
    }

    /* ── Auth card ── */
    .auth-card {
      background: #fff;
      border: 1px solid var(--stone-100);
      border-radius: 1.25rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.10);
      animation: slideUp 0.65s ease 0.15s both;
    }

    /* ── Form fields ── */
    .form-group-anim:nth-child(1) { animation: inputFade 0.5s ease 0.30s both; }
    .form-group-anim:nth-child(2) { animation: inputFade 0.5s ease 0.42s both; }
    .form-group-anim:nth-child(3) { animation: inputFade 0.5s ease 0.54s both; }
    .form-group-anim:nth-child(4) { animation: inputFade 0.5s ease 0.66s both; }

    .form-control {
      border-radius: 0.6rem;
      border: 1px solid var(--stone-300);
      padding: 0.7rem 0.9rem;
      font-size: 0.9rem;
      color: var(--stone-900);
      transition: border-color .2s, box-shadow .2s, transform .15s;
    }
    .form-control:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(120,53,15,.12);
      outline: none;
      transform: scale(1.01);
    }
    .form-label { font-size: 0.875rem; font-weight: 600; color: var(--stone-900); }

    /* ── Submit button ── */
    .btn-submit {
      background: var(--amber); color: #fff; border: none;
      border-radius: 0.6rem; font-weight: 700; padding: 0.8rem;
      width: 100%; font-size: 0.95rem; cursor: pointer;
      position: relative; overflow: hidden;
      transition: background .2s, transform .15s, box-shadow .2s;
      animation: inputFade 0.5s ease 0.72s both;
    }
    .btn-submit::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.25) 50%, transparent 100%);
      background-size: 200% 100%;
      opacity: 0;
      transition: opacity .2s;
    }
    .btn-submit:hover {
      background: var(--amber-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(120,53,15,.35);
    }
    .btn-submit:hover::after {
      opacity: 1;
      animation: shimmer 0.8s linear;
    }

    .link-amber { color: var(--amber); font-weight: 600; text-decoration: none; transition: color .2s; }
    .link-amber:hover { color: var(--amber-hover); text-decoration: underline; }

    .form-check-input:checked { background-color: var(--amber); border-color: var(--amber); }
    .form-check-input:focus { box-shadow: 0 0 0 3px rgba(120,53,15,.12); }

    .page-title {
      animation: slideUp 0.6s ease 0.05s both;
      font-size: 1.65rem; color: var(--stone-900);
    }
  </style>
</head>
<body>
<div class="min-vh-100 d-flex flex-column justify-content-center py-5 px-3">
  <div class="mx-auto w-100" style="max-width: 440px;">

    <!-- Logo -->
    <div class="text-center mb-4">
      <a th:href="@{/}" class="covo-logo">
        <img th:src="@{/images/logo.png}" alt="CovoURCA"/>
        <div class="covo-logo-text">
          <span class="covo-logo-name">CovoURCA</span>
         
        </div>
      </a>
      <h2 class="mt-4 fw-bold page-title">Connexion à votre compte</h2>
    </div>

    <!-- Card -->
    <div class="auth-card">
      <div class="p-4 p-sm-5">

        <div th:if="${param.erreur}" class="alert alert-danger rounded-3 py-2 small border-0">
          Email ou mot de passe incorrect.
        </div>
        <div th:if="${param.deconnecte}" class="alert alert-success rounded-3 py-2 small border-0">
          Vous avez été déconnecté.
        </div>
        <div th:if="${success}" class="alert alert-success rounded-3 py-2 small border-0" th:text="${success}"></div>

        <form th:action="@{/connexion}" method="post" class="d-flex flex-column gap-3">

          <div class="form-group-anim">
            <label class="form-label mb-1">Adresse email</label>
            <input type="email" class="form-control" name="username" required autofocus
                   placeholder="exemple@univ-reims.fr"/>
          </div>

          <div class="form-group-anim">
            <label class="form-label mb-1">Mot de passe</label>
            <input type="password" class="form-control" name="password" required
                   placeholder="••••••••"/>
          </div>

          <div class="form-group-anim d-flex justify-content-between align-items-center">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="remember">
              <label class="form-check-label small" for="remember" style="color:var(--stone-900);">
                Se souvenir de moi
              </label>
            </div>
            <a th:href="@{/mot-de-passe-oublie}" class="link-amber small">Mot de passe oublié ?</a>
          </div>

          <button type="submit" class="btn-submit mt-1">Se connecter</button>
        </form>

        <p class="text-center mt-4 mb-0 small" style="color: var(--stone-600); animation: inputFade 0.5s ease 0.8s both;">
          Pas encore inscrit ?
          <a th:href="@{/inscription}" class="link-amber">Créer un compte</a>
        </p>

      </div>
    </div>
  </div>
</div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
