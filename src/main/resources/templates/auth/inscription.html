<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Inscription – CovoURCA</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:600px">
  <div class="text-center mb-4">
    <h2 class="fw-bold" style="color:#8B6914;">CovoURCA</h2>
    <p class="text-muted">Créer un compte</p>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-4">
      <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

      <form th:action="@{/inscription}" th:object="${inscriptionDto}" method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nom *</label>
            <input type="text" class="form-control" th:field="*{nom}" required/>
            <div class="text-danger small" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Prénom *</label>
            <input type="text" class="form-control" th:field="*{prenom}" required/>
            <div class="text-danger small" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>
          </div>
          <div class="col-12">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control" th:field="*{email}" required/>
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
          </div>
          <div class="col-12">
            <label class="form-label">Mot de passe * <small class="text-muted">(6 caractères min.)</small></label>
            <input type="password" class="form-control" th:field="*{motDePasse}" required minlength="6"/>
            <div class="text-danger small" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></div>
          </div>
        </div>

        <hr class="my-4"/>
        <p class="fw-semibold mb-3">Je suis aussi conducteur (optionnel)</p>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Marque</label>
            <input type="text" class="form-control" th:field="*{marque}" placeholder="Renault"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Modèle</label>
            <input type="text" class="form-control" th:field="*{modele}" placeholder="Clio"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Couleur</label>
            <input type="text" class="form-control" th:field="*{couleur}" placeholder="Blanc"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Immatriculation</label>
            <input type="text" class="form-control" th:field="*{immatriculation}" placeholder="AB-123-CD"/>
          </div>
          <div class="col-md-6">
            <label class="form-label">Nombre de places</label>
            <input type="number" class="form-control" th:field="*{nombrePlaces}" min="1" max="8"/>
          </div>
        </div>

        <button type="submit" class="btn btn-warning w-100 mt-4 fw-semibold" style="background:#8B6914;border:0;color:#fff;">
          Créer mon compte
        </button>
      </form>
    </div>
  </div>
  <p class="text-center mt-3 text-muted">Déjà inscrit ? <a th:href="@{/connexion}">Se connecter</a></p>
</div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
