<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Historique – CovoURCA</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <h4 class="fw-bold mb-4">Historique de mes trajets</h4>

  <div th:if="${#lists.isEmpty(trajets)}" class="alert alert-info">
    Aucun trajet pour le moment.
  </div>

  <div class="card shadow-sm" th:if="${!#lists.isEmpty(trajets)}">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>Départ</th><th>Arrivée</th><th>Partenaire</th><th>Rôle</th><th>Statut</th><th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="t : ${trajets}">
            <td th:text="${t.demande.pointDepart.nomLieu}"></td>
            <td th:text="${t.demande.pointArrivee.nomLieu}"></td>
            <td>
              <span th:if="${t.conducteur.id == utilisateur.id}"
                    th:text="${t.passager.prenom + ' ' + t.passager.nom}"></span>
              <span th:if="${t.passager.id == utilisateur.id}"
                    th:text="${t.conducteur.prenom + ' ' + t.conducteur.nom}"></span>
            </td>
            <td>
              <span th:if="${t.conducteur.id == utilisateur.id}" class="badge bg-secondary">Conducteur</span>
              <span th:if="${t.passager.id == utilisateur.id}" class="badge bg-info text-dark">Passager</span>
            </td>
            <td>
              <span class="badge"
                    th:classappend="${t.statut.name() == 'TERMINE'} ? 'bg-success' : (${t.statut.name() == 'EN_COURS'} ? 'bg-primary' : 'bg-danger')"
                    th:text="${t.statut}"></span>
            </td>
            <td><a th:href="@{/trajets/{id}(id=${t.id})}" class="btn btn-sm btn-outline-secondary">Voir</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
