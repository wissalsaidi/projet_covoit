spring.application.name=CovoURCA

# ============================================================
# Base de données MySQL
# IMPORTANT : changer le mot de passe selon votre installation
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/covourca?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Paris
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false

# Session timeout 30 min
server.servlet.session.timeout=30m

# Port
server.port=8080
