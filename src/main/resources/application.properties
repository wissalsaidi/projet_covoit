spring.application.name=CovoURCA

# ============================================================
# Base de données MySQL
# IMPORTANT : changer le mot de passe selon votre installation
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:-jdbc:mysql://localhost:3306/covourca?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Paris}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:-root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:-root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Session timeout 30 min
server.servlet.session.timeout=30m

# Port
server.port=8080
